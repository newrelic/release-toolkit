name: Release notes MDX
description: Extracts a version's section from CHANGELOG.md and renders it as a docs-site MDX file
inputs:
  markdown:
    description: Path to the source CHANGELOG.md file
    required: false
    default: CHANGELOG.md
  version:
    description: Version to extract from the changelog, without a `v` prefix (e.g. 1.2.3)
    required: true
  subject:
    description: Product or component name to stamp in the `subject` frontmatter field (e.g. "Agent Control")
    required: true
  repo:
    description: GitHub repository in `owner/name` form, used to build the release notes link
    required: true
  output:
    description: Path of the MDX file to write. If omitted, defaults to "<repo-name>-<version-with-dashes>.mdx"
    required: false
    default: ""
runs:
  using: docker
  image: ../Dockerfile
  args:
    - release-notes-mdx
    - --markdown
    - ${{ inputs.markdown }}
    - --version
    - ${{ inputs.version }}
    - --subject
    - ${{ inputs.subject }}
    - --repo
    - ${{ inputs.repo }}
    - --output
    - ${{ inputs.output }}
